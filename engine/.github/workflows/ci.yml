# Engine-local CI. This workflow travels with `git subtree split --prefix=engine`
# so the extracted standalone repo has working CI from its first commit (M7).
# While engine/ lives inside the parent repo it is NOT executed here (GitHub only
# runs workflows under the repo-root .github/); the parent runs the mirror at
# ../../.github/workflows/engine.yml instead.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Tesseract OCR (real OCR path — S2.1 geometry backend, DT-11 tier 1)
        # The PyMuPDF+Tesseract backend's OCR tests run hard-asserted here (no skipif, no
        # skip-masking): missing tesseract must FAIL the suite, not silently skip. eng data is
        # installed explicitly (the base package bundling it is not assumed). TESSDATA_PREFIX
        # discovery is best-effort (an empty find leaves it unset); fitz.get_tessdata() is the
        # fallback, and its failure surfaces fail-loud in the tests (GeometryError), never a skip.
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          td="$(find /usr/share -name eng.traineddata 2>/dev/null | head -1)"
          if [ -n "$td" ]; then echo "TESSDATA_PREFIX=$(dirname "$td")" >> "$GITHUB_ENV"; fi

      - name: Sync (with language and assessment integration extras)
        run: uv sync --extra it --extra assessment

      - name: Tests (full suite — unit + golden + integration, mirrors local)
        run: uv run pytest -q

      - name: No top-level pipeline imports leak into the package
        # _generate_*.py are dev-time golden-fixture generators — the one sanctioned
        # place that imports the live tree (read-only). They are never collected by
        # pytest nor imported by the package, so they are excluded from the gate.
        run: |
          ! grep -rEn --exclude='_generate_*.py' \
            'from (download|ocr|reconcile|triage|cleanup|adjudicate|validate|translate|multi_translate|refine|typeset|companion|pipeline|utils|providers|typography|edgren|hoare|vision_review) import|^[[:space:]]*import (pipeline|utils|providers)$' \
            src tests
